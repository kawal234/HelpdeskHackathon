services:
  - type: web
    name: helpdesk-mini
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_PATH
        value: /opt/render/project/src/database/helpdesk.db
      - key: PORT
        value: 3000
